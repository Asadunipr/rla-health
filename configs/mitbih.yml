seed: 42
data_dir: data/mitbih
out_dir: experiments/results/mitbih

model:
  backbone: tiny_tcn
  tcn:
    channels: 48
    depth: 4

training:
  epochs: 40
  batch_size: 256
  val_batch_size: 256
  lr: 1e-3
  loss: trimmed
  huber_delta: 1.0
  trimmed_p: 0.10
  curriculum_start: 0.5
  early_stop_patience: 12

# train on standardized inputs, but score & validate in RAW space (handled in code)
preprocess:
  robust_standardize: true

decision:
  kappa: 1.2           # ↓ from 2.5 since we now score in RAW space
  smooth_median_len: 7 # moderate smoothing
