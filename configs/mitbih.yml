seed: 42
data_dir: data/mitbih
out_dir: experiments/results/mitbih

model:
  backbone: tiny_tcn
  tcn:
    channels: 48
    depth: 4         # 6 is fine too; 4 is faster on CPU

training:
  epochs: 40         # with early stopping; was 120
  batch_size: 256    # lower if RAM is tight (128 or 64)
  val_batch_size: 256
  lr: 1e-3
  loss: trimmed      # 'trimmed' | 'huber' | 'mse'
  huber_delta: 1.0
  trimmed_p: 0.10    # more aggressive trimming; 0.05–0.10 are reasonable
  curriculum_start: 0.5
  early_stop_patience: 12

preprocess:
  robust_standardize: true  # apply robust per-window median/MAD standardization

decision:
  kappa: 2.5
  smooth_median_len: 9      # longer median smoothing to reduce flicker
