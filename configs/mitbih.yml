seed: 42
data_dir: data/mitbih
out_dir: experiments/results/mitbih

model:
  backbone: tiny_tcn
  tcn:
    channels: 48
    depth: 4

training:
  epochs: 40
  batch_size: 256
  val_batch_size: 256
  lr: 1e-3
  loss: trimmed         # 'trimmed' | 'huber' | 'mse'
  huber_delta: 0.5
  trimmed_p: 0.10
  curriculum_start: 0.5
  early_stop_patience: 12
  huber_after_epoch: 20  # switch to Huber after epoch 20 (set -1 to disable)

preprocess:
  # Train on standardized inputs; validate & score in RAW space (see code).
  robust_standardize: true
  # Optional pre-filtering (off by default). Enable via 'true' and set window/k.
  hampel: false
  hampel_win: 9
  hampel_k: 3.0

#decision:
#  method: "mad"         # 'mad' or 'quantile'
#  kappa: 1.2            # used if method == 'mad'
  # quantile: 0.995     # used if method == 'quantile'
#  smooth_median_len: 7


decision:
  method: "mad"
  kappa: 1.0
  smooth_median_len: 7
